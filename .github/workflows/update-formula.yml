name: Update Formula
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Formula name (e.g., caesura)'
        required: true
        type: string
      version:
        description: 'Version to update to (e.g., 0.26.0)'
        required: true
        type: string
      repo:
        description: 'Source repo (default: RogueOneEcho/<name>)'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Update formula
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: ./scripts/update-formula.sh "${{ inputs.name }}" "${{ inputs.version }}" "${{ inputs.repo }}"

    - name: Show formula
      run: cat "Formula/${{ inputs.name }}.rb"

    - name: Commit and push
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git add "Formula/${{ inputs.name }}.rb"
        git diff --cached --quiet || git commit -m "Update ${{ inputs.name }} to ${{ inputs.version }}"
        git push
